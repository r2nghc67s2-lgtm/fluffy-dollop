<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>البث المباشر</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07080b;
      --panel: #101116;
      --border: #30323b;
      --text: #f1f1f5;
      --muted: #92949e;
      --gold: #f2bb55;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      background: radial-gradient(ellipse at 50% -20%, #282116, transparent 45%), var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
    }

    .page { width: min(100%, 1040px); margin: auto; }

    .header, .panel {
      border: 1px solid var(--border);
      border-radius: 30px;
      background: linear-gradient(145deg, #111218, #090a0e);
      box-shadow: 0 18px 55px #0005, inset 0 1px #ffffff08;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 26px 30px;
      margin-bottom: 22px;
    }

    h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 38px); }
    .subtitle, .hint { color: var(--muted); line-height: 1.8; margin: 0; }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 11px 15px;
      border: 1px solid #34363e;
      border-radius: 999px;
      color: var(--muted);
      white-space: nowrap;
      background: #090a0e;
    }

    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #777983; }
    .status.is-live { color: #c8f6df; border-color: #286647; }
    .status.is-live .status-dot { background: #5ed49a; box-shadow: 0 0 12px #5ed49a99; }

    .panel { padding: 24px; }

    .actions {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 22px;
    }

    .action {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px;
      border: 1px solid #353740;
      border-radius: 18px;
      background: #0a0b0f;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: .18s ease;
    }

    .action:hover:not(:disabled) {
      transform: translateY(-2px);
      border-color: var(--gold);
      background: #17140f;
      box-shadow: 0 8px 24px #d99b3022;
    }

    .action:active:not(:disabled) { transform: scale(.98); }
    .action:focus-visible { outline: 2px solid #ffdc8a; outline-offset: 3px; }
    .action:disabled { opacity: .5; cursor: not-allowed; }
    .action svg { width: 22px; height: 22px; flex: 0 0 auto; color: var(--gold); }

    .primary {
      color: #171006;
      font-weight: bold;
      border-color: #e8b650;
      background: linear-gradient(#ffdc8a, #d49328);
    }

    .primary svg { color: #171006; }
    .primary:hover:not(:disabled) { background: linear-gradient(#ffe6aa, #e3a83f); }

    .viewer {
      overflow: hidden;
      border: 1px solid #30323a;
      border-radius: 23px;
      background: #050609;
    }

    .viewer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 20px;
      border-bottom: 1px solid #282a31;
    }

    h2 { margin: 0; font-size: 19px; }

    .video-wrap {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 9;
      background: radial-gradient(ellipse, #17130d, transparent 58%), #050609;
    }

    .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    .empty svg { width: 46px; height: 46px; display: block; margin: 0 auto 12px; color: var(--gold); }
    .hint { padding: 15px 4px 0; font-size: 14px; }

    @media (max-width: 760px) {
      .header { align-items: flex-start; flex-direction: column; padding: 22px; }
      .panel { padding: 15px; }
      .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .action:last-child { grid-column: 1 / -1; }
    }

    @media (max-width: 420px) {
      .actions { grid-template-columns: 1fr; }
      .action:last-child { grid-column: auto; }
      .viewer-top { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1>البث المباشر</h1>
        <p class="subtitle">تابع البث وتواصل معي من مكان واحد.</p>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="statusText">البث لم يُفتح بعد</span>
      </div>
    </header>

    <section class="panel">
      <nav class="actions" aria-label="خيارات المستخدم">
        <a class="action" id="websiteButton" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>
          </svg>
          رابط موقعي
        </a>

        <button class="action" id="refreshButton" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"/>
          </svg>
          تحديث البث
        </button>

        <a class="action" id="contactButton" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3h.5a8.5 8.5 0 0 1 8 8v.5Z"/>
          </svg>
          راسلني
        </a>

        <a class="action" id="aiButton" href="#" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7m10 10 2.1 2.1m0-14.2L17 7M7 17l-2.1 2.1"/>
          </svg>
          شات الذكاء الاصطناعي
        </a>

        <button class="action primary" id="watchButton" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 4.8c0-1.2 1.3-1.9 2.3-1.3l11 6.7a2.1 2.1 0 0 1 0 3.6l-11 6.7A1.5 1.5 0 0 1 7 19.2V4.8Z"/>
          </svg>
          عرض البث المباشر
        </button>
      </nav>

      <section class="viewer" aria-label="مشغل البث المباشر">
        <div class="viewer-top">
          <h2>مشاهدة البث</h2>
          <span class="subtitle" id="viewerMessage">اضغط «عرض البث المباشر» للبدء</span>
        </div>
        <div class="video-wrap" id="videoWrap">
          <div class="empty" id="emptyState">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3V9Z"/>
            </svg>
            سيظهر البث هنا عند تشغيله.
          </div>
        </div>
      </section>

      <p class="hint">إذا لم يظهر البث، جرّب تحديثه أو تحقّق من رابط البث.</p>
    </section>
  </main>

  <script>
    // استبدل الروابط التجريبية بروابطك الفعلية.
    const CONFIG = {
      websiteURL: "https://example.com",
      contactURL: "mailto:you@example.com",
      aiChatURL: "https://example.com/ai-chat",
      streamEmbedURL: "https://www.youtube.com/embed/live_stream?channel=YOUR_CHANNEL_ID"
    };

    const websiteButton = document.getElementById("websiteButton");
    const contactButton = document.getElementById("contactButton");
    const aiButton = document.getElementById("aiButton");
    const refreshButton = document.getElementById("refreshButton");
    const watchButton = document.getElementById("watchButton");
    const videoWrap = document.getElementById("videoWrap");
    const status = document.getElementById("status");
    const statusText = document.getElementById("statusText");
    const viewerMessage = document.getElementById("viewerMessage");

    websiteButton.href = CONFIG.websiteURL;
    contactButton.href = CONFIG.contactURL;
    aiButton.href = CONFIG.aiChatURL;

    function showStream(refresh = false) {
      if (!CONFIG.streamEmbedURL || CONFIG.streamEmbedURL.includes("YOUR_CHANNEL_ID")) {
        viewerMessage.textContent = "أضف رابط تضمين البث في إعدادات الصفحة أولاً";
        statusText.textContent = "رابط البث غير مكتمل";
        return;
      }

      const oldFrame = videoWrap.querySelector("iframe");
      if (oldFrame) oldFrame.remove();

      const empty = document.getElementById("emptyState");
      if (empty) empty.remove();

      const frame = document.createElement("iframe");
      frame.src = CONFIG.streamEmbedURL;
      frame.title = "البث المباشر";
      frame.allow = "autoplay; encrypted-media; picture-in-picture";
      frame.allowFullscreen = true;
      videoWrap.appendChild(frame);

      status.classList.add("is-live");
      statusText.textContent = "مشغل البث مفتوح";
      viewerMessage.textContent = refresh ? "تم تحديث مشغل البث" : "يتم تحميل البث…";
    }

    watchButton.addEventListener("click", () => showStream());
    refreshButton.addEventListener("click", () => showStream(true));
  </script>
</body>
</html>
